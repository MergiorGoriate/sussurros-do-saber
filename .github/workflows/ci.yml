name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-drill:
    name: PostgreSQL restore drill
    runs-on: ubuntu-latest
    container: postgres:18-bookworm
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: fixture-only-password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: fixture-only-password
      RESTORE_ADMIN_URL: postgresql://postgres:fixture-only-password@postgres/postgres
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-venv
      - run: python3 -m venv /tmp/drill && /tmp/drill/bin/pip install -r requirements.txt
      - name: Validate versioned schema on PostgreSQL 18
        env:
          DATABASE_URL: postgresql://postgres:fixture-only-password@postgres/migrations_fixture
        run: |
          createdb migrations_fixture
          /tmp/drill/bin/alembic upgrade head
          psql -v ON_ERROR_STOP=1 -d migrations_fixture -c "INSERT INTO category (id, name, slug) VALUES (7, 'Biologia', 'biologia')"
          /tmp/drill/bin/alembic upgrade head
          test "$(psql -At -d migrations_fixture -c 'SELECT name FROM category WHERE id=7')" = Biologia
      - name: Validate lifecycle fixes with PostgreSQL foreign keys
        env:
          DATABASE_URL: postgresql://postgres:fixture-only-password@postgres/functionality_fixture
          SECRET_KEY: isolated-audit-secret
          ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
        run: |
          createdb functionality_fixture
          /tmp/drill/bin/alembic upgrade head
          /tmp/drill/bin/python -m unittest discover -s tests -p 'test_functionality_audit.py' -v
          /tmp/drill/bin/python -m unittest discover -s tests -p 'test_editorial_audit.py' -v
          /tmp/drill/bin/python -m unittest discover -s tests -p 'test_portal_reviewer_account.py' -v
          /tmp/drill/bin/python -m unittest discover -s tests -p 'test_role_access_contract.py' -v
          /tmp/drill/bin/python -m unittest discover -s tests -p 'test_portal_workflow_transitions.py' -v
          /tmp/drill/bin/python -m unittest discover -s tests -p 'test_team_invitation_flow.py' -v
          /tmp/drill/bin/python -m unittest discover -s tests -p 'test_notification_inbox_ui.py' -v
      - name: Restore synthetic archive and verify production fixture is unchanged
        run: |
          createdb sussurros_fixture
          psql -v ON_ERROR_STOP=1 -d sussurros_fixture -f tests/fixtures/restore.sql
          pg_dump -Fc -d sussurros_fixture -f /tmp/fixture.dump
          /tmp/drill/bin/python scripts/restore_drill.py /tmp/fixture.dump --report /tmp/restore-report.json
          /tmp/drill/bin/python - <<'PY'
          import json
          from pathlib import Path
          import psycopg
          report = json.loads(Path('/tmp/restore-report.json').read_text())
          assert report['restore_completed'] and not report['content_review_completed']
          assert report['counts']['article'] == 1
          assert report['counts']['comment'] == 1
          assert report['broken_relations'] == 0
          with psycopg.connect(dbname='sussurros_fixture') as conn:
              assert conn.execute('SELECT count(*) FROM article').fetchone()[0] == 1
          PY
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/sussurros-ci.db
      SECRET_KEY: ci-only-secret-key
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-strong-password
      SITE_URL: https://www.sussurrosdosaber.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt

  browser:
    name: Browser and JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:////tmp/sussurros-browser-ci.db
      SECRET_KEY: ci-browser-secret-key
      ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-strong-password
      SITE_URL: http://127.0.0.1:5000
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:css
      - name: Upload compiled Tailwind CSS
        uses: actions/upload-artifact@v7
        with:
          name: compiled-tailwind-css
          path: static/css/tailwind.css
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - name: Create browser journal fixture
        run: |
          python - <<'PY'
          from app import app
          from models import db, Journal
          with app.app_context():
              journal = Journal.query.filter_by(slug="revista-de-teste-cientifico").first()
              if not journal:
                  journal = Journal(slug="revista-de-teste-cientifico", title="Revista científica de teste", field="Biologia", description="Revista usada nos testes de navegação.")
                  db.session.add(journal)
              journal.published = True
              journal.content_markdown = "# Artigo de teste\n\n## Introdução\n\nTexto de teste.\n\n## Desenvolvimento com um título longo que deve caber no índice em dispositivos móveis\n\nTexto de teste.\n\n### Métodos\n\nTexto de teste."
              journal.references = "Fonte: https://example.org/estudo"
              db.session.commit()
          PY
      - name: Start Flask application
        run: |
          python -m gunicorn --pythonpath tests/browser browser_test_server:app --bind 127.0.0.1:5000 --workers 1 --timeout 60 > /tmp/sussurros-server.log 2>&1 &
          echo $! > /tmp/sussurros-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5000/healthz && exit 0
            sleep 1
          done
          cat /tmp/sussurros-server.log
          exit 1
      - run: node --test tests/consent.test.cjs
      - run: npm run test:e2e
      - name: Show isolated server failures
        if: failure()
        run: tail -n 120 /tmp/sussurros-server.log
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
            /tmp/sussurros-server.log
          if-no-files-found: ignore
          retention-days: 7





