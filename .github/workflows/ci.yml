name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/sussurros-ci.db
      SECRET_KEY: ci-only-secret-key
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-strong-password
      SITE_URL: https://www.sussurrosdosaber.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt

  browser:
    name: Browser and JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:////tmp/sussurros-browser-ci.db
      SECRET_KEY: ci-browser-secret-key
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-strong-password
      SITE_URL: http://127.0.0.1:5000
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build:css
      - name: Upload compiled Tailwind CSS
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tailwind-css
          path: static/css/tailwind.css
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - name: Start Flask application
        run: |
          python -m gunicorn app:app --bind 127.0.0.1:5000 --workers 1 --timeout 60 > /tmp/sussurros-server.log 2>&1 &
          echo $! > /tmp/sussurros-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5000/healthz && exit 0
            sleep 1
          done
          cat /tmp/sussurros-server.log
          exit 1
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
            /tmp/sussurros-server.log
          if-no-files-found: ignore
          retention-days: 7
