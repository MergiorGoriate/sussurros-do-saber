services:
  - type: web
    name: sussurros-do-saber
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SITE_URL
        value: https://www.sussurrosdosaber.com
      - key: ADMIN_TIMEZONE
        value: Africa/Maputo
