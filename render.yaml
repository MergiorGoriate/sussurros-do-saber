services:
  - type: web
    name: sussurros-do-saber
    runtime: python
    buildCommand: npm install --no-audit --no-fund && npm run build:css && pip install -r requirements.txt
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:${PORT:-10000} --workers 1 --timeout 120 --access-logfile - --error-logfile - --capture-output --log-level info
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NODE_VERSION
        value: 22.14.0
      - key: SITE_URL
        value: https://www.sussurrosdosaber.com
      - key: GOOGLE_SITE_VERIFICATION
        value: MBbrCatBKLtKz2UmAJQsYlJ95ZEpNQ3CJvRMTo6aGwE
      - key: ADMIN_TIMEZONE
        value: Africa/Maputo
