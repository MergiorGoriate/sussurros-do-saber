<form method="post" enctype="multipart/form-data" action="{{ url_for('submissions.upload',ident=manuscript.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Categoria<select name="kind" required>{% for key,label in file_kinds.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><label>Ficheiro<input type="file" name="file" accept=".docx,.pdf,.png,.jpg,.jpeg,.xlsx,.csv,.txt" required aria-describedby="uploadHelp"></label><p id="uploadHelp" class="submission-help">Até 8 MB por ficheiro, 25 ficheiros por versão e 100 MB por conta. DOCX, PDF, PNG, JPEG, XLSX, CSV e TXT, conforme a categoria e a política da revista. Os originais permanecem privados.</p><button class="submission-button">Enviar ficheiro</button></form>
