<dialog id="reader-dialog" class="reader-dialog" aria-labelledby="reader-title">
<button type="button" data-reader-close class="reader-close" aria-label="Fechar janela">×</button>
<h2 id="reader-title">A sua conta no Sussurros do Saber</h2>
<p id="reader-purpose">Entre para guardar artigos e acompanhar actualizações.</p>
<div class="reader-tabs"><button type="button" data-reader-mode="login" aria-pressed="true">Entrar</button><button type="button" data-reader-mode="register" aria-pressed="false">Criar conta</button></div>
<form id="reader-auth-form">
<label id="reader-name-label" hidden>Nome completo<input name="name" minlength="2" maxlength="180" autocomplete="name"></label>
<label>E-mail<input name="email" type="email" maxlength="254" autocomplete="email" required></label>
<label>Palavra-passe<input name="password" type="password" maxlength="128" autocomplete="current-password" required></label>
<p id="reader-password-help" hidden>Use entre 12 e 128 caracteres. Receberá um e-mail para confirmar a conta.</p>
<button type="submit" class="primary-btn" id="reader-submit">Entrar</button>
</form>
<p id="reader-auth-status" role="status" aria-live="polite"></p>
<a href="{{ url_for('submissions.forgot_password') }}">Esqueci a palavra-passe</a>
<p><a href="/conta/biblioteca">Os meus favoritos</a> · <a href="/conta/notificacoes">Notificações</a></p>
</dialog>
