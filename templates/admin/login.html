<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Administração</title><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head><body class="login-page"><form method="post" class="login-card"><img src="{{ url_for('static',filename='img/logo-sussurros-horizontal.png') }}" alt="Sussurros do Saber"><h1>Área administrativa</h1><p>Entre para gerir o conteúdo editorial.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Utilizador<input name="username" required autocomplete="username"></label><label>Palavra-passe<input name="password" type="password" required autocomplete="current-password"></label><button class="admin-primary">Entrar</button><a href="/">← Voltar ao site</a></form></body></html>
