{% extends 'admin/base.html' %}{% block title %}Autores{% endblock %}{% block content %}<header class="admin-header"><div><span>Equipa editorial</span><h1>Autores</h1></div></header><div class="two-columns"><form method="post" class="admin-panel compact-form"><h2>Adicionar autor</h2><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="name" required></label><label>E-mail<input name="email" type="email"></label><label>Biografia<textarea name="bio" rows="5"></textarea></label><button class="admin-primary">Adicionar</button></form><section class="admin-panel"><h2>Autores registados</h2>{% for author in authors %}<form method="post" class="record-editor"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="author_id" value="{{ author.id }}"><label>Nome<input name="name" value="{{ author.name }}" required></label><label>E-mail<input name="email" type="email" value="{{ author.email or '' }}"></label><label>Biografia<textarea name="bio" rows="3">{{ author.bio }}</textarea></label><small>{{ author.articles|length }} artigo(s)</small><button class="admin-primary">Guardar alterações</button><button formmethod="post" formaction="{{ url_for('admin.delete_author',author_id=author.id) }}" onclick="return confirm('Eliminar este autor?')" class="danger-button">Eliminar</button></form>{% endfor %}</section></div>{% endblock %}
