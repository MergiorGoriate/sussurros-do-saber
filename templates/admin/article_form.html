{% extends 'admin/base.html' %}{% block title %}{{ 'Editar artigo' if article.id else 'Novo artigo' }}{% endblock %}{% block content %}<header class="admin-header"><div><span>Conteúdo editorial</span><h1>{{ 'Editar artigo' if article.id else 'Novo artigo' }}</h1></div><a href="{{ url_for('admin.articles') }}">← Voltar</a></header><form method="post" class="editor-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><section class="editor-main"><label>Título<input name="title" value="{{ article.title or '' }}" required minlength="5"></label><label>Resumo<textarea name="summary" rows="3" required>{{ article.summary or '' }}</textarea></label><label>Conteúdo<textarea name="body" rows="18" placeholder="Separe os parágrafos com uma linha vazia.">{{ article.body or '' }}</textarea></label><label>Endereço da imagem<input id="imageUrl" name="image" type="url" value="{{ article.image or '' }}" placeholder="https://..."></label><img id="imagePreview" class="image-preview" src="{{ article.image or '' }}" alt="Pré-visualização da imagem" {% if not article.image %}hidden{% endif %}></section><aside class="editor-side"><label>Estado<select name="status"><option value="draft" {% if article.status=='draft' %}selected{% endif %}>Rascunho</option><option value="published" {% if article.status=='published' %}selected{% endif %}>Publicado</option><option value="scheduled" {% if article.status=='scheduled' %}selected{% endif %}>Programado</option></select></label><label>Programar para<input name="scheduled_at" type="datetime-local" value="{{ article.scheduled_at.strftime('%Y-%m-%dT%H:%M') if article.scheduled_at else '' }}"></label><label>Autor<select name="author_id" required>{% for author in authors %}<option value="{{ author.id }}" {% if article.author_id==author.id %}selected{% endif %}>{{ author.name }}</option>{% endfor %}</select></label><label>Categoria<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if article.category_id==category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Tempo de leitura<input name="read_minutes" type="number" min="1" value="{{ article.read_minutes or 5 }}"></label><label>Slug<input name="slug" value="{{ article.slug or '' }}" placeholder="gerado automaticamente"></label><label class="check"><input name="featured" type="checkbox" {% if article.featured %}checked{% endif %}> Artigo em destaque</label><button class="admin-primary">Guardar artigo</button></aside></form><script>const input=document.querySelector('#imageUrl'),preview=document.querySelector('#imagePreview');input.addEventListener('input',()=>{preview.src=input.value;preview.hidden=!input.value})</script>{% endblock %}
