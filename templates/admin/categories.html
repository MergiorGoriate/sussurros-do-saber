{% extends 'admin/base.html' %}{% block title %}Categorias{% endblock %}{% block content %}<header class="admin-header"><div><span>Organização</span><h1>Categorias</h1></div></header><div class="two-columns"><form method="post" class="admin-panel compact-form"><h2>Adicionar categoria</h2><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="name" required></label><button class="admin-primary">Adicionar</button></form><section class="admin-panel"><h2>Categorias registadas</h2>{% for category in categories %}<form method="post" class="record-editor"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="category_id" value="{{ category.id }}"><label>Nome<input name="name" value="{{ category.name }}" required></label><small>{{ category.articles|length }} artigo(s)</small><button class="admin-primary">Guardar</button><button formmethod="post" formaction="{{ url_for('admin.delete_category',category_id=category.id) }}" data-confirm="Eliminar esta categoria?" class="danger-button">Eliminar</button></form>{% endfor %}</section></div>{% endblock %}
