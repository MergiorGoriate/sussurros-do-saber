{% extends 'admin/base.html' %}
{% block title %}{{ 'Editar revista' if journal.id else 'Nova revista' }}{% endblock %}
{% block content %}
<header class="admin-header"><div><span>Catálogo científico</span><h1>{{ 'Editar revista' if journal.id else 'Nova revista' }}</h1></div><a href="{{ url_for('admin.journals') }}">← Voltar</a></header>
<form method="post" enctype="multipart/form-data" class="editor-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<section class="editor-main">
<label>Título<input name="title" required minlength="3" maxlength="180" value="{{ journal.title or '' }}"></label>
<label>Descrição<textarea name="description" required minlength="20" maxlength="4000" rows="6">{{ journal.description or '' }}</textarea></label>
<label>Diretrizes editoriais<textarea name="guidelines" rows="14" placeholder="Escopo, critérios, formato, ética, revisão e submissão...">{{ journal.guidelines or '' }}</textarea><small>Aceita Markdown.</small></label>
<label>Capa via Cloudinary<input name="cover_file" type="file" accept="image/jpeg,image/png,image/webp"></label>
<label>Ou URL da capa<input name="cover_image" type="url" value="{{ journal.cover_image or '' }}" placeholder="https://..."></label>
<label>Texto alternativo da capa<input name="cover_alt" maxlength="300" value="{{ journal.cover_alt or '' }}"></label>
{% if journal.cover_image %}<img class="image-preview" src="{{ journal.cover_image|image_variant(800) }}" alt="Pré-visualização da capa">{% endif %}
</section>
<aside class="editor-side">
<label>Abreviatura<input name="abbreviation" maxlength="30" value="{{ journal.abbreviation or '' }}"></label>
<label>Área científica<input name="field" required maxlength="140" value="{{ journal.field or '' }}"></label>
<label>ISSN<input name="issn" maxlength="9" pattern="[0-9]{4}-[0-9]{3}[0-9Xx]" value="{{ journal.issn or '' }}" placeholder="1234-567X"></label>
<label>Periodicidade<input name="frequency" maxlength="80" value="{{ journal.frequency or '' }}" placeholder="Semestral"></label>
<label>Edição atual<input name="current_issue" maxlength="120" value="{{ journal.current_issue or '' }}" placeholder="Vol. 1 · N.º 1"></label>
<label>Slug<input name="slug" maxlength="200" value="{{ journal.slug or '' }}" placeholder="gerado automaticamente"></label>
<label class="check"><input name="published" type="checkbox" {% if journal.published %}checked{% endif %}> Publicada no catálogo</label>
<button class="admin-primary">Guardar revista</button>
</aside></form>
{% endblock %}
