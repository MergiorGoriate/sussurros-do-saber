<form method="get" class="science-filters" aria-label="Filtrar métricas científicas">
<label>Período<select name="period">{% for value,label in [('7','7 dias'),('30','30 dias'),('90','90 dias'),('365','365 dias'),('custom','Personalizado')] %}<option value="{{ value }}" {% if options.period==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Desde (personalizado)<input type="date" name="from" value="{{ options.start }}"></label><label>Até (personalizado)<input type="date" name="to" value="{{ options.end }}"></label>
{% if available is defined %}<label>Revista<select name="journal"><option value="">Todas</option>{% for title in available|map(attribute='title')|unique|sort %}<option {% if options.journal==title %}selected{% endif %}>{{ title }}</option>{% endfor %}</select></label><label>Ano de publicação<input type="number" name="year" min="1800" max="2200" value="{{ options.year }}" placeholder="Todos"></label><label>Edição<select name="issue"><option value="">Todas</option>{% for issue in issues %}<option {% if options.issue==issue %}selected{% endif %}>{{ issue }}</option>{% endfor %}</select></label><label>Artigo<select name="article"><option value="">Todos</option>{% for item in available %}<option value="{{ item.id }}" {% if options.article==item.id|string %}selected{% endif %}>{{ item.article_title or item.title }}</option>{% endfor %}</select></label><label>Autor ou ORCID<input name="author" maxlength="180" value="{{ options.author }}"></label>{% endif %}
<label>Fonte de citações<select name="source">{% for key,label in sources.items() %}{% if key!='altmetric' %}<option value="{{ key }}" {% if options.source==key %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}</select></label><button type="submit">Aplicar filtros</button><a href="{{ request.path }}">Repor filtros</a>
</form>
